spring.application.name=wanderly-backend

spring.datasource.url=jdbc:mysql://localhost:3306/wanderly
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT secret. Set JWT_SECRET in your environment before running the backend.
jwt.secret=${JWT_SECRET:CHANGE_THIS_LOCAL_JWT_SECRET}
